name: Safna dagsögu

# Keyrir á hverri nóttu, dregur gærdaginn saman fyrir báðar veðurstöðvar og
# vistar í data/daily.json. Einvígið, bingóið og metaveggurinn lesa þá skrá.

on:
  schedule:
    - cron: '25 0 * * *'        # 00:25 að íslenskum tíma (UTC)
  workflow_dispatch:
    inputs:
      from:
        description: 'Sækja allt upp á nýtt frá þessum degi (ÁÁÁÁ-MM-DD). Autt = bara það sem vantar.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sækja og draga saman
        env:
          FROM: ${{ inputs.from }}
        run: node scripts/collect.mjs

      - name: Vista ef eitthvað breyttist
        # Líka þótt söfnunin renni út á tíma: það sem komið er geymist og næsta keyrsla heldur áfram.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/daily.json ]; then echo "Engin gagnaskrá."; exit 0; fi
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "Engar breytingar."
          else
            git commit -m "Dagsaga $(date -u +%F)"
            # Ef eitthvað var vistað í geymsluna á meðan verkið keyrði.
            git pull --rebase origin main
            git push
          fi
